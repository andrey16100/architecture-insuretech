http {

   # Зона для ограничения запросов: 10 запросов в минуту с одного IP
   # Из задания не понятно на всех ли 10 запросов в минуту или на пратнера
   # В данном случае ограничения именно на партнера, т.к. если считать всего - не решаем проблему перерасхода лимитом одним из партнеров.

   limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/m;

   # Настройка upstream для балансировки нагрузки
   upstream backend_servers {
       server backend1.example.com;
       server backend2.example.com;
       server backend3.example.com;
   }

   server {
       listen 80;

       location / {

            # Применение ограничения
            limit_req zone=req_limit;
            
            # Возврат HTTP 429 при превышении лимита
            limit_req_status 429;

           proxy_pass http://backend_servers;
       }

   }
}
